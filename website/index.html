      <h1>双击 <span class="opt">Option</span>，即刻启动</h1>
      <p class="lede">开源免费的环形启动器，在光标处打开。</p>
      <div class="hero-stage">
      <div class="hero-tilt">
      <div class="hero" role="img" aria-label="环形启动器，共八个槽位。顶部微信图标带青色高光，环心写着微信；顺时针还有一个深色图标、Safari、邮件、音乐和备忘录，左侧两个槽位为空。">
        <svg class="ring-art" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <defs>
            <linearGradient id="r-fill" x1="0.32" y1="0" x2="0.68" y2="1">
              <stop offset="0%" stop-color="#F6F2EC"/>
              <stop offset="48%" stop-color="#EEE9E1"/>
              <stop offset="100%" stop-color="#E3DDD4"/>
            </linearGradient>
            <filter id="r-grain" x="0" y="0" width="100%" height="100%">
              <feTurbulence type="fractalNoise" baseFrequency="1.4" numOctaves="2" seed="3" result="n"/>
              <feColorMatrix type="saturate" values="0" in="n" result="g"/>
              <feComponentTransfer in="g">
                <feFuncA type="table" tableValues="0 0.055"/>
              </feComponentTransfer>
            </filter>
            <mask id="r-torus" maskUnits="userSpaceOnUse">
              <rect width="400" height="400" fill="black"/>
              <circle cx="200" cy="200" r="172" fill="white"/>
              <circle cx="200" cy="200" r="84" fill="black"/>
            </mask>
            <radialGradient id="r-cyan" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#8FDCEA" stop-opacity="0.55"/>
              <stop offset="55%" stop-color="#8FDCEA" stop-opacity="0.18"/>
              <stop offset="100%" stop-color="#8FDCEA" stop-opacity="0"/>
            </radialGradient>
          </defs>

          <g mask="url(#r-torus)">
            <rect width="400" height="400" fill="url(#r-fill)"/>
            <rect width="400" height="400" filter="url(#r-grain)"/>
          </g>

          <!-- outer bezel: dark hairline + inner light hairline -->
          <circle cx="200" cy="200" r="172" fill="none" stroke="#C9C3B9" stroke-width="1.15"/>
          <circle cx="200" cy="200" r="170.2" fill="none" stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="1.05"/>
          <!-- inner bezel -->
          <circle cx="200" cy="200" r="84" fill="none" stroke="#C9C3B9" stroke-width="1.15"/>
          <circle cx="200" cy="200" r="85.85" fill="none" stroke="#FFFFFF" stroke-opacity="0.65" stroke-width="1.05"/>

          <!-- WeChat accent: a quiet wash on the band, clipped to the torus -->
          <ellipse class="r-cyan-wash" cx="200" cy="78" rx="58" ry="46" fill="url(#r-cyan)" mask="url(#r-torus)"/>

          <g transform="translate(72, 200)">
            <circle r="35.2" fill="#E7E2DA"/>
            <circle r="35.2" fill="none" stroke="#BDB7AE" stroke-width="1.15"/>
            <circle r="34.05" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="0.9"/>
            <path d="M-7.6 0h15.2M0-7.6v15.2" fill="none" stroke="#8A8580" stroke-width="1.65" stroke-linecap="round"/>

    <script>
      (function () {
        var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        var stage = document.querySelector(".hero-stage");
        var tilt = document.querySelector(".hero-tilt");
        if (reduce || !stage || !tilt) return;

        var targetX = 0, targetY = 0, curX = 0, curY = 0;
        var max = 5;
        var main = document.querySelector("main");

        function onMove(e) {
          var r = stage.getBoundingClientRect();
          var dx = (e.clientX - (r.left + r.width / 2)) / (r.width / 2);
          var dy = (e.clientY - (r.top + r.height / 2)) / (r.height / 2);
          if (dx > 1) dx = 1; else if (dx < -1) dx = -1;
          if (dy > 1) dy = 1; else if (dy < -1) dy = -1;
          targetX = dx * max;
          targetY = -dy * max;
        }
        function onLeave() {
          targetX = 0;
          targetY = 0;
        }

        window.addEventListener("mousemove", onMove, { passive: true });
        if (main) main.addEventListener("mouseleave", onLeave);

        function tick() {
          curX += (targetX - curX) * 0.12;
          curY += (targetY - curY) * 0.12;
          if (Math.abs(curX) < 0.01 && Math.abs(targetX) === 0) curX = 0;
          if (Math.abs(curY) < 0.01 && Math.abs(targetY) === 0) curY = 0;
          tilt.style.transform = "rotateY(" + curX.toFixed(3) + "deg) rotateX(" + curY.toFixed(3) + "deg)";
          requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);
      })();
    </script>
