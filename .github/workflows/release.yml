# Publish two ad-hoc signed DMGs on GitHub Releases:
#   Ring-<version>-intel.dmg           executable is x86_64 only
#   Ring-<version>-apple-silicon.dmg   executable is arm64 only
# <version> is the tag without the leading v (v0.1.2 → 0.1.2). No zip is
# uploaded. This file only edits the Release for the tag it was started
# from; it does not retag or edit any other release.
#
# Signing stays ad-hoc. scripts/build.sh runs `codesign --sign -`. This
# workflow does not call notarytool, import a certificate, or read any secret
# other than the default GITHUB_TOKEN (contents: write creates the Release).
#
# Runner and toolchain match CI: macos-26 with Xcode 26.3 selected via
# xcode-select and DEVELOPER_DIR. The image can compile this package
# (Swift tools 6.0, deployment target macOS 13.0).
name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Require a version tag
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*$ ]]; then
            echo "Refusing to publish '${tag}'." >&2
            echo "Push a tag like v1.0.0, or run this workflow from that tag." >&2
            echo "Current ref: ${GITHUB_REF}" >&2
            exit 1
          fi

      - name: Select Xcode 26.3
        run: |
          set -euo pipefail
          app="/Applications/Xcode_26.3.app"
          if [[ ! -d "$app" ]]; then
            echo "Xcode 26.3 is not installed at ${app}" >&2
            ls /Applications | grep -i Xcode || true
            exit 1
          fi
          sudo xcode-select -s "$app"
          echo "xcode-select: $(xcode-select -p)"
          # Read each tool to completion, then match the saved text.
          # `grep -q` closes a pipe after the first hit; xcodebuild then
          # aborts (exit 134) while writing the next "Build version" line.
          xcodebuild_version="$(xcodebuild -version)"
          printf '%s\n' "$xcodebuild_version"
          if ! grep -q 'Xcode 26\.3' <<< "$xcodebuild_version"; then
            echo "xcodebuild did not report Xcode 26.3" >&2
            exit 1
          fi
          xcrun --find swift
          xcrun_swift_version="$(xcrun swift --version)"
          printf '%s\n' "$xcrun_swift_version"
          if ! grep -q 'Apple Swift version 6\.2' <<< "$xcrun_swift_version"; then
            echo "xcrun swift did not report Apple Swift version 6.2" >&2
            exit 1
          fi
          # scripts/test.sh and scripts/build.sh invoke `swift` on PATH.
          command -v swift
          swift_version="$(swift --version)"
          printf '%s\n' "$swift_version"
          if ! grep -q 'Apple Swift version 6\.2' <<< "$swift_version"; then
            echo "swift on PATH did not report Apple Swift version 6.2" >&2
            exit 1
          fi

      - name: Unit tests
        run: ./scripts/test.sh

      - name: Package and verify Intel DMG
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          # build/Ring.app is what scripts/test-output-guard.sh hashes next.
          RING_OUTPUT_DIR="${GITHUB_WORKSPACE}/build" \
            ./scripts/package-dmg.sh x86_64 "${RUNNER_TEMP}/Ring-${version}-intel.dmg"

      - name: Check output-path guard
        run: ./scripts/test-output-guard.sh

      - name: Package and verify Apple Silicon DMG
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          RING_OUTPUT_DIR="${GITHUB_WORKSPACE}/build/package-arm64" \
            ./scripts/package-dmg.sh arm64 "${RUNNER_TEMP}/Ring-${version}-apple-silicon.dmg"

      - name: Publish DMGs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          intel="${RUNNER_TEMP}/Ring-${version}-intel.dmg"
          silicon="${RUNNER_TEMP}/Ring-${version}-apple-silicon.dmg"
          intel_name="Ring-${version}-intel.dmg"
          silicon_name="Ring-${version}-apple-silicon.dmg"

          for f in "$intel" "$silicon"; do
            if [[ ! -s "$f" ]]; then
              echo "Missing DMG: ${f}" >&2
              exit 1
            fi
          done

          notes="${RUNNER_TEMP}/release-notes.md"
          cat > "$notes" <<EOF
          Ring ${version} for macOS.

          Download the disk image that matches your Mac. Each file is a compressed DMG with Ring.app at the top of the volume. There is no zip.

          - ${intel_name} — Intel Macs. The executable is x86_64 only.
          - ${silicon_name} — Apple Silicon (M-series) Macs. The executable is arm64 only.

          Apple menu → About This Mac: if Chip is Apple M1 or later, use the Apple Silicon DMG. If Processor is Intel, use the Intel DMG. An arm64-only app does not run on an Intel Mac.

          This build is ad-hoc signed only. It is not notarized, and it is not Developer ID signed. macOS Gatekeeper will block the first launch until you allow the app yourself.

          1. Double-click the DMG in Finder to open it. The volume contains Ring.app.
          2. Drag Ring.app to the Applications folder if you want it there. You can also open it from the disk image.
          3. The first launch may be blocked. Then use either of these:
             - System Settings → Privacy & Security → Open Anyway
             - or right-click the app and choose Open, then confirm Open
          4. Input Monitoring is a separate permission. After Gatekeeper lets the app open, use the menu bar command to request Input Monitoring, then enable Ring under System Settings → Privacy & Security → Input Monitoring. Quit and reopen Ring if macOS asks you to.

          此构建只做了 ad-hoc 签名，没有公证。请按机型下载 DMG，不是 zip：Intel 用 ${intel_name}（只有 x86_64），Apple 芯片（M 系列）用 ${silicon_name}（只有 arm64）。在访达里双击 DMG，卷内顶层是 Ring.app。第一次打开可能被 Gatekeeper 拦截。请到「系统设置 → 隐私与安全性」点「仍要打开」，或在访达里右键 Ring.app 选择「打开」。放行之后仍需单独授予「输入监控」权限。
          EOF

          title="Ring ${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$intel" "$silicon" --clobber
            gh release edit "$tag" --title "$title" --notes-file "$notes"
            # Drop anything else on this tag (the old zip, or a stale
            # re-run). gh is pointed at "$tag" only.
            asset_names="$(gh release view "$tag" --json assets --jq '.assets[].name')"
            while IFS= read -r name; do
              [[ -z "$name" ]] && continue
              if [[ "$name" == "$intel_name" || "$name" == "$silicon_name" ]]; then
                continue
              fi
              echo "Removing ${name} from ${tag}"
              gh release delete-asset "$tag" "$name" --yes
            done <<< "$asset_names"
          else
            gh release create "$tag" "$intel" "$silicon" \
              --title "$title" --notes-file "$notes"
          fi

          final="$(gh release view "$tag" --json assets --jq '.assets[].name')"
          printf '%s\n' "$final"
          expected="$(printf '%s\n%s\n' "$intel_name" "$silicon_name" | sort)"
          actual="$(printf '%s\n' "$final" | sed '/^$/d' | sort)"
          if [[ "$actual" != "$expected" ]]; then
            echo "Release ${tag} must attach exactly these two DMGs and no zip:" >&2
            printf '%s\n' "$expected" >&2
            echo "Actual assets:" >&2
            printf '%s\n' "${actual:-<none>}" >&2
            exit 1
          fi
          gh release view "$tag" --json url,tagName,assets
