# Pull-request tests only. Publishing stays in release.yml.
#
# Runner: macos-26 (Apple Silicon), the current GitHub-hosted macOS 26 image.
# Package.swift requires Swift tools 6.0. README verification is Xcode 26.3 /
# Swift 6.2.4. That Xcode is installed on the image but is not the default
# (default is 26.6). Select it with xcode-select and DEVELOPER_DIR. The
# Xcode 26.3 bundle does not expose an executable at Contents/Developer/usr/bin/swift;
# xcrun swift is the toolchain entry point.
name: CI

on:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode 26.3
        run: |
          set -euo pipefail
          app="/Applications/Xcode_26.3.app"
          if [[ ! -d "$app" ]]; then
            echo "Xcode 26.3 is not installed at ${app}" >&2
            ls /Applications | grep -i Xcode || true
            exit 1
          fi
          sudo xcode-select -s "$app"
          echo "xcode-select: $(xcode-select -p)"
          # Read each tool to completion, then match the saved text.
          # `grep -q` closes a pipe after the first hit; xcodebuild then
          # aborts (exit 134) while writing the next "Build version" line.
          xcodebuild_version="$(xcodebuild -version)"
          printf '%s\n' "$xcodebuild_version"
          if ! grep -q 'Xcode 26\.3' <<< "$xcodebuild_version"; then
            echo "xcodebuild did not report Xcode 26.3" >&2
            exit 1
          fi
          xcrun --find swift
          xcrun_swift_version="$(xcrun swift --version)"
          printf '%s\n' "$xcrun_swift_version"
          if ! grep -q 'Apple Swift version 6\.2' <<< "$xcrun_swift_version"; then
            echo "xcrun swift did not report Apple Swift version 6.2" >&2
            exit 1
          fi
          # scripts/test.sh and scripts/build.sh invoke `swift` on PATH.
          command -v swift
          swift_version="$(swift --version)"
          printf '%s\n' "$swift_version"
          if ! grep -q 'Apple Swift version 6\.2' <<< "$swift_version"; then
            echo "swift on PATH did not report Apple Swift version 6.2" >&2
            exit 1
          fi

      - name: Unit tests
        run: ./scripts/test.sh
